name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  contract-tests:
    name: 契约测试 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 安装文档构建依赖
        # h5/build_h5.py 与 h5/build_site.py 需要 markdown 包；
        # 契约测试会构建站点并校验 h5/index.html 是否过期
        run: python -m pip install --quiet -r h5/requirements.txt

      - name: 契约测试（死链 / 锚点 / 行内路径 / 凭据红线 / 探针 selftest / 站点构建）
        run: python -m unittest discover -s tests -v

      - name: Python 示例字节码编译
        run: python -m compileall -q examples

      - name: Shell 脚本语法检查
        if: runner.os == 'Linux'
        run: |
          for f in examples/*.sh; do
            echo "bash -n $f"
            bash -n "$f"
          done

      - name: PowerShell 脚本语法检查
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errs = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'examples/quick_setup.ps1'), [ref]$null, [ref]$errs) | Out-Null
          if ($errs.Count -gt 0) { $errs | ForEach-Object { Write-Error $_.Message }; exit 1 }
          Write-Host "quick_setup.ps1 语法 OK"
