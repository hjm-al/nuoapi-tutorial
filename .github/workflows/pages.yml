name: Pages

# 把仓库 Markdown 构建成多页教程站并部署到 GitHub Pages。
# 首次使用：仓库 Settings → Pages → Source 选 "GitHub Actions"。
on:
  push:
    branches: [main]
    paths:
      - "**.md"
      - "google*.html"
      - "BingSiteAuth.xml"
      - "h5/**"
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# 部署到 Pages 所需的最小权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一次部署；新推送取消排队中的旧任务，不取消进行中的发布
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # 站点根地址：优先用仓库变量（Settings → Variables），
  # 未设置时按 GitHub Pages 默认的 project pages 形态推导。
  SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
  REPO_URL: ${{ github.server_url }}/${{ github.repository }}
  # 搜索后台的站点验证码。只在仓库 Variables 中设置后输出到页面，源码不保存验证码。
  GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
  BING_SITE_VERIFICATION: ${{ vars.BING_SITE_VERIFICATION }}
  BAIDU_SITE_VERIFICATION: ${{ vars.BAIDU_SITE_VERIFICATION }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 安装构建依赖
        run: python -m pip install --quiet -r h5/requirements.txt

      - name: 构建多页站点
        run: python h5/build_site.py --base-url "$SITE_URL" --repo-url "$REPO_URL" --out _site

      - name: 校验产物（页数 / sitemap / 站内链接）
        run: |
          python - <<'PY'
          import pathlib, sys
          site = pathlib.Path("_site")
          verification_pages = sorted(site.glob("google*.html"))
          pages = sorted(
              path for path in site.rglob("*.html")
              if path not in verification_pages
          )
          assert pages, "没有生成任何可索引页面"
          assert verification_pages, "缺少 Google 所有权验证文件"
          assert (site / "BingSiteAuth.xml").exists(), "缺少 Bing 所有权验证文件"
          assert (site / "sitemap.xml").exists(), "缺少 sitemap.xml"
          assert (site / "robots.txt").exists(), "缺少 robots.txt"
          assert (site / ".nojekyll").exists(), "缺少 .nojekyll"
          locs = (site / "sitemap.xml").read_text(encoding="utf-8").count("<loc>")
          print("pages={0} sitemap_urls={1} verification_files={2}".format(
              len(pages), locs, len(verification_pages)
          ))
          if locs != len(pages):
              sys.exit("sitemap 条目数与页面数不一致")
          PY

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 通知 IndexNow
        shell: bash
        run: |
          # submit_indexnow.py writes status and URL counts to GITHUB_STEP_SUMMARY.
          set +e
          python h5/submit_indexnow.py --site-url "$SITE_URL"
          exit_code=$?
          set -e
          if [ "$exit_code" -ne 0 ]; then
            echo "::warning::IndexNow notification failed; the Pages deployment remains active."
          fi
          exit 0
